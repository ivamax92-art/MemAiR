{% extends "base.html" %}
{% block title %}Лента мемов — MemAiR{% endblock %}

{% block content %}
<main class="main-container">
    <div class="page-header">
        <img src="{{ url_for('static', filename='images/lentamemov.png') }}" alt="Лента мемов" class="page-title-img">
        <div style="display: flex; gap: 8px; background: rgba(255,255,255,0.6); padding: 6px; border-radius: var(--radius-md); backdrop-filter: blur(5px);">
            <a href="{{ url_for('feed', sort='fresh') }}" class="btn-rate filter-link {{ 'active' if current_sort == 'fresh' else '' }}">Свежие</a>
            <a href="{{ url_for('feed', sort='popular') }}" class="btn-rate filter-link {{ 'active' if current_sort == 'popular' else '' }}">Популярные</a>
            <a href="{{ url_for('feed', sort='ai') }}" class="btn-rate filter-link {{ 'active' if current_sort == 'ai' else '' }}">Топ AI</a>
        </div>
    </div>

    <div class="meme-grid">
        {% for p in items %}
        <article class="meme-card">
            {% if p.score >= 80 %}
                <div class="ai-badge high">🔥 {{ p.score }}/100</div>
            {% else %}
                <div class="ai-badge medium">😐 {{ p.score }}/100</div>
            {% endif %}
            
            <!-- Заменили onclick на data-src -->
            <div class="meme-image-wrapper" data-src="{{ url_for('static', filename='images/' + p.image) }}">
                <img src="{{ url_for('static', filename='images/' + p.image) }}" alt="{{ p.title }}" class="meme-image">
            </div>
            
            <div class="meme-author">
                <div class="author-avatar-sm"></div>
                <span class="author-name">{{ p.author }}</span>
            </div>
            
            <div class="interaction-bar">
                <div style="display: flex; gap: 8px;">
                    <button class="btn-rate">👍 <span>{{ p.likes }}</span></button>
                    <button class="btn-rate">👎 <span>{{ p.dislikes }}</span></button>
                </div>
            </div>
        </article>
        {% endfor %}
    </div>
</main>

<!-- Модальное окно -->
<div id="memeLightbox" class="lightbox">
    <span class="close-btn">&times;</span>
    <img class="lightbox-content" id="lightboxImg" src="" alt="Просмотр мема">
</div>
{% endblock %}
